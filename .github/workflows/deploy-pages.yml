name: GitHub Pages 배포

on:
  push:
    branches: ["claude/hei-b0N1Z"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to gh-pages
        run: git push origin HEAD:gh-pages --force
