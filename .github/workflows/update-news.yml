name: 뉴스 데이터 자동 업데이트

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 오전 7시 KST (UTC 22:00 전날)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/hei-b0N1Z
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch news from RSS
        run: python scripts/update_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "자동 뉴스 업데이트: $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push origin claude/hei-b0N1Z
          fi
