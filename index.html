<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="뉴스 브리핑">
<title>뉴스 브리핑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1a1a2e;
  --gold:#e0c97f;
  --bg:#f8f9fa;
  --white:#ffffff;
  --trend:#ff6b6b;
  --social:#4ecdc4;
  --it:#45b7d1;
  --global:#96ceb4;
  --text:#1a1a2e;
  --sub:#666;
  --border:#eee;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;display:flex;flex-direction:column}

/* HEADER */
header{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--navy);color:var(--white);
  padding:0 16px;height:56px;flex-shrink:0;position:relative;z-index:10;
}
.header-left,.header-right{display:flex;align-items:center;gap:4px;width:56px}
.header-right{justify-content:flex-end}
.header-title{font-size:17px;font-weight:700;color:var(--gold);letter-spacing:0.5px}
.icon-btn{
  background:none;border:none;color:var(--white);cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;padding:0;position:relative;
}
.icon-btn:active{background:rgba(255,255,255,0.1);transform:scale(0.9)}
.icon-btn{transition:transform 0.1s,-webkit-tap-highlight-color 0s}
.hamburger{display:flex;flex-direction:column;gap:5px;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px}
.bell-icon{font-size:22px;line-height:1}
.notif-dot{
  position:absolute;top:6px;right:6px;
  width:9px;height:9px;border-radius:50%;
  background:#e53935;border:1.5px solid var(--navy);
  display:none;
}
.notif-dot.show{display:block}
.loading-ring{
  display:none;width:16px;height:16px;
  border:2px solid rgba(224,201,127,0.3);
  border-top-color:var(--gold);
  border-radius:50%;animation:spin 0.8s linear infinite;
  margin-left:6px;
}
.loading-ring.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* CALENDAR */
.calendar-wrap{flex:1;display:flex;flex-direction:column;background:var(--white);overflow:hidden}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 6px}
.cal-nav-btn{
  background:none;border:none;cursor:pointer;
  color:var(--navy);font-size:22px;padding:6px 12px;line-height:1;border-radius:8px;
}
.cal-nav-btn:active{background:var(--bg)}
.cal-title{font-size:17px;font-weight:700;color:var(--navy)}
.weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  padding:0 6px;margin-bottom:2px;
}
.wd{text-align:center;font-size:11px;font-weight:600;color:#999;padding:3px 0}
.wd:first-child{color:#e53935}
.wd:last-child{color:#1565c0}
.days-grid{
  flex:1;display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,1fr);
  padding:0 6px 6px;
}
.day{
  display:flex;flex-direction:column;align-items:center;
  padding-top:3px;cursor:pointer;border-radius:8px;
  transition:background 0.15s,transform 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.day:active{background:var(--bg);transform:scale(0.92)}
.day.empty{cursor:default;pointer-events:none}
.day-num{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;font-weight:500;color:var(--text);
}
.day.other .day-num{color:#ccc}
.day.sun:not(.other) .day-num{color:#e53935}
.day.sat:not(.other) .day-num{color:#1565c0}
.day.today .day-num{background:var(--navy);color:var(--white);font-weight:700}
.day.selected:not(.today) .day-num{background:var(--gold);color:var(--navy);font-weight:700}
.day.today.selected .day-num{background:var(--gold);color:var(--navy)}
.day.sun.today .day-num,.day.sat.today .day-num{color:var(--white)}
.day.sun.selected .day-num,.day.sat.selected .day-num{color:var(--navy)}
.news-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--gold);margin-top:2px;
}

/* MENU DRAWER */
.menu-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200}
.menu-bg.open{display:block}
.menu-drawer{
  position:fixed;top:0;left:-270px;width:270px;height:100%;
  background:var(--navy);z-index:201;
  transition:left 0.28s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;padding:0;
}
.menu-drawer.open{left:0}
.menu-head{
  padding:60px 24px 24px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.menu-brand{color:var(--gold);font-size:22px;font-weight:800;letter-spacing:1px}
.menu-sub{color:rgba(255,255,255,0.45);font-size:12px;margin-top:4px}
.menu-list{list-style:none;padding:12px 12px;flex:1}
.menu-list li{margin-bottom:2px}
.menu-item-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;background:none;border:none;
  color:rgba(255,255,255,0.8);text-decoration:none;
  padding:13px 12px;border-radius:10px;font-size:15px;
  cursor:pointer;text-align:left;font-family:inherit;
  transition:background 0.15s,transform 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.menu-item-btn:active{background:rgba(255,255,255,0.12);color:var(--white);transform:scale(0.97)}
.menu-item-icon{font-size:18px;width:24px;text-align:center}

/* TIME SETTING MODAL */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.5);z-index:300;
  align-items:center;justify-content:center;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--white);border-radius:20px;
  padding:28px 24px;width:88%;max-width:340px;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
.modal-title{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--sub);margin-bottom:22px}
.time-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px}
.time-label{font-size:14px;color:var(--sub);white-space:nowrap}
.time-select{
  border:2px solid var(--border);border-radius:10px;
  padding:10px 8px;font-size:16px;font-weight:700;
  color:var(--navy);background:var(--bg);outline:none;
  -webkit-appearance:none;appearance:none;
  text-align:center;min-width:70px;
}
.time-select:focus{border-color:var(--gold)}
.modal-btns{display:flex;gap:10px}
.btn-cancel{
  flex:1;padding:13px;border:2px solid var(--border);
  background:none;border-radius:12px;font-size:15px;
  color:var(--sub);cursor:pointer;font-weight:600;font-family:inherit;
  transition:transform 0.1s,opacity 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.btn-cancel:active{transform:scale(0.95);opacity:0.7}
.btn-save{
  flex:2;padding:13px;background:var(--navy);
  border:none;border-radius:12px;font-size:15px;
  color:var(--white);cursor:pointer;font-weight:700;font-family:inherit;
  transition:transform 0.1s,background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.btn-save:active{transform:scale(0.95);background:#2d2d4e}

/* SAVE SUCCESS POPUP */
.success-popup{
  display:none;position:fixed;inset:0;
  z-index:500;align-items:center;justify-content:center;
  pointer-events:none;
}
.success-popup.show{display:flex}
.success-card{
  background:var(--white);border-radius:24px;
  padding:32px 28px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,0.18);
  animation:popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  min-width:200px;
}
@keyframes popIn{
  from{opacity:0;transform:scale(0.7)}
  to{opacity:1;transform:scale(1)}
}
.success-icon{font-size:48px;margin-bottom:12px;display:block}
.success-title{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:6px}
.success-time{font-size:22px;font-weight:800;color:var(--gold)}

/* NOTIFICATION DROPDOWN */
.notif-panel{
  display:none;position:fixed;top:56px;right:0;
  width:min(340px,100vw);max-height:calc(100vh - 56px);
  background:var(--white);z-index:150;
  box-shadow:-2px 4px 20px rgba(0,0,0,0.15);
  border-radius:0 0 0 16px;overflow:hidden;
  flex-direction:column;
  animation:slideDown 0.2s ease;
}
.notif-panel.open{display:flex}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-header{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.notif-header-title{font-size:15px;font-weight:700;color:var(--navy)}
.notif-close-btn{
  background:none;border:none;font-size:16px;
  color:var(--sub);cursor:pointer;padding:4px;
}
.notif-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.notif-item{
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background 0.15s;
}
.notif-item:active{background:var(--bg)}
.notif-item:last-child{border-bottom:none}
.notif-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.notif-date{font-size:12px;font-weight:700;color:var(--sub)}
.notif-unread-badge{
  font-size:10px;font-weight:700;color:var(--white);
  background:#e53935;border-radius:10px;padding:2px 7px;
}
.notif-read-badge{
  font-size:10px;font-weight:700;color:var(--sub);
  background:var(--bg);border-radius:10px;padding:2px 7px;
}
.notif-preview{
  font-size:13px;color:var(--text);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.notif-preview-suffix{color:var(--sub)}
.notif-empty{padding:32px 16px;text-align:center;color:var(--sub);font-size:14px}

/* NEWS POPUP (bottom sheet) */
.news-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.5);z-index:250;
  align-items:flex-end;
}
.news-bg.open{display:flex}
.news-sheet{
  background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-height:92vh;display:flex;flex-direction:column;
  animation:slideUp 0.28s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.news-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 0}
.news-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 0;
}
.news-date-title{font-size:16px;font-weight:800;color:var(--navy)}
.news-close{
  background:var(--bg);border:none;border-radius:50%;
  width:30px;height:30px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--sub);
}
.news-tabs{
  display:flex;gap:0;padding:12px 16px 0;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
}
.news-tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex-shrink:0;padding:8px 14px;border:none;background:var(--bg);
  border-radius:20px;font-size:13px;font-weight:600;color:var(--sub);
  cursor:pointer;margin-right:8px;font-family:inherit;
  transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn:active{transform:scale(0.94)}
.tab-btn.active{color:var(--white);font-weight:700}
.tab-btn[data-cat="trend"].active{background:var(--trend)}
.tab-btn[data-cat="social"].active{background:var(--social)}
.tab-btn[data-cat="it"].active{background:var(--it)}
.tab-btn[data-cat="global"].active{background:var(--global)}
.news-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 40px}

/* ACCORDION */
.news-section{margin-bottom:14px}
.news-section-hd{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:10px;margin-bottom:2px;
}
.news-section-icon{font-size:15px}
.news-section-label{font-size:13px;font-weight:800;color:var(--white)}
.acc-item{border-bottom:1px solid var(--border)}
.acc-item:last-child{border-bottom:none}
.acc-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 2px;cursor:pointer;gap:12px;
  -webkit-tap-highlight-color:transparent;
  transition:opacity 0.1s;
}
.acc-title:active{opacity:0.5}
.acc-title-text{font-size:14px;font-weight:600;color:var(--navy);line-height:1.45;flex:1}
.acc-arrow{
  font-size:20px;color:#bbb;flex-shrink:0;line-height:1;
  transition:transform 0.22s cubic-bezier(0.4,0,0.2,1),color 0.2s;
  font-weight:300;
}
.acc-arrow.open{transform:rotate(90deg);color:var(--navy)}
.acc-body{
  max-height:0;overflow:hidden;
  transition:max-height 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.25s;
  opacity:0;
}
.acc-body.open{max-height:400px;opacity:1}
.acc-summary{
  font-size:13.5px;color:#444;line-height:1.75;
  padding-bottom:4px;word-break:keep-all;
}
.acc-summary b{color:var(--navy);font-weight:700}
.acc-source{
  font-size:11px;color:#aaa;
  margin-top:6px;margin-bottom:14px;
  text-align:right;
}

.news-card{
  background:var(--bg);border-radius:14px;
  padding:14px;margin-bottom:10px;
}
.news-card-cat{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--white);
  padding:3px 8px;border-radius:10px;margin-bottom:8px;
}
.news-card-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;line-height:1.4}
.news-card-summary{font-size:13px;color:var(--sub);line-height:1.55}
.news-card-source{
  font-size:11px;color:#aaa;text-align:right;
  margin-top:8px;
}
.news-loading{
  display:flex;align-items:center;justify-content:center;
  padding:40px;flex-direction:column;gap:12px;
  color:var(--sub);font-size:14px;
}
.loading-spinner{
  width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--navy);border-radius:50%;
  animation:spin 0.8s linear infinite;
}
.no-news{padding:32px 16px;text-align:center;color:var(--sub);font-size:14px}

/* TOAST */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,46,0.92);color:var(--white);
  padding:10px 20px;border-radius:20px;font-size:14px;
  z-index:500;opacity:0;transition:opacity 0.25s;
  white-space:nowrap;pointer-events:none;max-width:90vw;
  text-align:center;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="icon-btn" id="menuBtn" onclick="openMenu()" aria-label="메뉴">
      <div class="hamburger"><span></span><span></span><span></span></div>
    </button>
    <div class="loading-ring" id="loadingRing"></div>
  </div>
  <span class="header-title">뉴스 브리핑</span>
  <div class="header-right">
    <button class="icon-btn" id="bellBtn" onclick="toggleNotifPanel()" aria-label="알림">
      <span class="bell-icon">🔔</span>
      <span class="notif-dot" id="notifDot"></span>
    </button>
  </div>
</header>

<div class="calendar-wrap">
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
    <span class="cal-title" id="calTitle"></span>
    <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
  </div>
  <div class="weekdays">
    <div class="wd">일</div><div class="wd">월</div><div class="wd">화</div>
    <div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd">토</div>
  </div>
  <div class="days-grid" id="daysGrid"></div>
</div>

<!-- MENU DRAWER -->
<div class="menu-bg" id="menuBg" onclick="closeMenu()"></div>
<nav class="menu-drawer" id="menuDrawer">
  <div class="menu-head">
    <div class="menu-brand">뉴스 브리핑</div>
    <div class="menu-sub">매일 아침 뉴스를 한눈에</div>
  </div>
  <ul class="menu-list">
    <li><button class="menu-item-btn" onclick="openTimeModal();closeMenu()"><span class="menu-item-icon">⏰</span>시간 설정</button></li>
    <li><button class="menu-item-btn" onclick="refreshTodayNews();closeMenu()"><span class="menu-item-icon">🔄</span>뉴스 새로고침</button></li>
  </ul>
</nav>

<!-- TIME SETTING MODAL -->
<div class="modal-bg" id="timeModalBg" onclick="closeTimeModalBg(event)">
  <div class="modal">
    <div class="modal-title">알림 시간 설정</div>
    <div class="modal-desc">매일 뉴스 브리핑을 받을 시간을 설정하세요.</div>
    <div class="time-row">
      <span class="time-label">오전</span>
      <select class="time-select" id="hourSelect"></select>
      <span class="time-label">시</span>
      <select class="time-select" id="minuteSelect"></select>
      <span class="time-label">분</span>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTimeModal()">취소</button>
      <button class="btn-save" onclick="saveTime()">저장</button>
    </div>
  </div>
</div>

<!-- NOTIFICATION PANEL -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-header">
    <span class="notif-header-title">알림</span>
    <button class="notif-close-btn" onclick="closeNotifPanel()">✕</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>

<!-- NEWS POPUP -->
<div class="news-bg" id="newsBg" onclick="closeNewsOnBg(event)">
  <div class="news-sheet" id="newsSheet">
    <div class="news-handle"></div>
    <div class="news-head">
      <span class="news-date-title" id="newsDateTitle"></span>
      <button class="news-close" onclick="closeNews()">✕</button>
    </div>
    <div class="news-content" id="newsContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- SUCCESS POPUP -->
<div class="success-popup" id="successPopup">
  <div class="success-card">
    <span class="success-icon">✅</span>
    <div class="success-title">알림 시간 저장됨</div>
    <div class="success-time" id="successTime"></div>
  </div>
</div>

<script>
// ===== STATE =====
const S = {
  today: new Date(),
  year: new Date().getFullYear(),
  month: new Date().getMonth(),
  selected: null,
  newsData: {},
  settings: { hour: 8, minute: 0 },
  notifState: {},
  currentNewsDate: null,
  currentTab: 'trend',
  notifPanelOpen: false,
  checkTimer: null
};

const CAT_META = {
  trend:  { label: '트렌드',   color: '#ff6b6b', icon: '🔥' },
  social: { label: '사회/경제', color: '#4ecdc4', icon: '💰' },
  it:     { label: 'IT',        color: '#45b7d1', icon: '💻' },
  global: { label: '해외뉴스',  color: '#96ceb4', icon: '🌍' }
};

function fmt(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}

function fmtShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const todayStr = fmt(S.today);
  const diff = Math.round((new Date(todayStr) - new Date(dateStr)) / 86400000);
  if (diff === 0) return '오늘 ' + dateStr.slice(5).replace('-','.');
  if (diff === 1) return '어제 ' + dateStr.slice(5).replace('-','.');
  return `${diff}일 전 ` + dateStr.slice(5).replace('-','.');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== INIT =====
async function init() {
  loadSettings();
  initSelects();
  await loadNewsData();
  renderCalendar();
  checkNotification();
  S.checkTimer = setInterval(checkNotification, 30000);
  setupSwipe();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('nbr_settings') || 'null');
    if (s) S.settings = s;
    const n = JSON.parse(localStorage.getItem('nbr_notif') || 'null');
    if (n) S.notifState = n;
  } catch(e) {}
}

function saveNotifState() {
  localStorage.setItem('nbr_notif', JSON.stringify(S.notifState));
}

function initSelects() {
  const hs = document.getElementById('hourSelect');
  const ms = document.getElementById('minuteSelect');
  for (let h = 5; h <= 12; h++) {
    const o = document.createElement('option');
    o.value = h; o.textContent = h + '시';
    if (h === S.settings.hour) o.selected = true;
    hs.appendChild(o);
  }
  [0,10,20,30,40,50].forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = String(m).padStart(2,'0') + '분';
    if (m === S.settings.minute) o.selected = true;
    ms.appendChild(o);
  });
}

// ===== NEWS DATA =====
async function loadNewsData() {
  setLoading(true);
  try {
    const res = await fetch('./news_data.json?v=' + Date.now());
    if (res.ok) S.newsData = await res.json();
    const cached = localStorage.getItem('nbr_news_cache');
    if (cached) {
      try {
        const cachedData = JSON.parse(cached);
        Object.keys(cachedData).forEach(date => {
          if (!S.newsData[date]) S.newsData[date] = cachedData[date];
        });
      } catch(e) {}
    }
  } catch(e) {}
  setLoading(false);
  tryFetchRSS();
}

function setLoading(on) {
  document.getElementById('loadingRing').classList.toggle('show', on);
}

async function tryFetchRSS() {
  const PROXY = 'https://api.allorigins.win/raw?url=';
  const FEEDS = {
    trend:  'https://www.yna.co.kr/RSS/entertainment.xml',
    social: 'https://www.yna.co.kr/RSS/economy.xml',
    it:     'https://www.yna.co.kr/RSS/it.xml',
    global: 'https://www.yna.co.kr/RSS/international.xml'
  };
  const todayStr = fmt(S.today);
  const cacheDate = localStorage.getItem('nbr_news_cache_date');
  if (cacheDate === todayStr) return;

  setLoading(true);
  try {
    const result = {};
    await Promise.all(Object.entries(FEEDS).map(async ([cat, url]) => {
      try {
        const res = await fetch(PROXY + encodeURIComponent(url));
        if (!res.ok) return;
        const txt = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(txt, 'text/xml');
        const items = Array.from(xml.querySelectorAll('item')).slice(0, 3);
        result[cat] = items.map(item => ({
          title: item.querySelector('title')?.textContent?.trim() || '',
          summary: (item.querySelector('description')?.textContent || '')
            .replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 180),
          source: '연합뉴스'
        })).filter(a => a.title);
      } catch(e) {}
    }));

    const cats = ['trend','social','it','global'];
    if (cats.some(c => result[c] && result[c].length > 0)) {
      S.newsData[todayStr] = {
        trend:  result.trend  || S.newsData[todayStr]?.trend  || [],
        social: result.social || S.newsData[todayStr]?.social || [],
        it:     result.it     || S.newsData[todayStr]?.it     || [],
        global: result.global || S.newsData[todayStr]?.global || []
      };
      localStorage.setItem('nbr_news_cache', JSON.stringify(S.newsData));
      localStorage.setItem('nbr_news_cache_date', todayStr);
      renderCalendar();
    }
  } catch(e) {}
  setLoading(false);
}

async function refreshTodayNews() {
  localStorage.removeItem('nbr_news_cache_date');
  toast('뉴스를 업데이트하는 중...');
  await tryFetchRSS();
  renderCalendar();
  toast('뉴스가 업데이트됐습니다.');
}

// ===== CALENDAR =====
function renderCalendar() {
  const grid = document.getElementById('daysGrid');
  const title = document.getElementById('calTitle');
  title.textContent = `${S.year}년 ${S.month + 1}월`;
  grid.innerHTML = '';

  const todayStr = fmt(S.today);
  const selStr = S.selected ? fmt(S.selected) : todayStr;
  const firstDay = new Date(S.year, S.month, 1).getDay();
  const daysInMonth = new Date(S.year, S.month + 1, 0).getDate();
  const prevDays = new Date(S.year, S.month, 0).getDate();

  for (let i = firstDay - 1; i >= 0; i--) {
    grid.appendChild(makeDay(prevDays - i, S.year, S.month - 1, true, todayStr, selStr));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    grid.appendChild(makeDay(d, S.year, S.month, false, todayStr, selStr));
  }
  const total = grid.children.length;
  const fill = total <= 35 ? 35 - total : 42 - total;
  for (let d = 1; d <= fill; d++) {
    grid.appendChild(makeDay(d, S.year, S.month + 1, true, todayStr, selStr));
  }
}

function makeDay(d, y, m, other, todayStr, selStr) {
  const cell = document.createElement('div');
  cell.className = 'day';
  const real = new Date(y, m, d);
  const ds = fmt(real);
  const dow = real.getDay();

  if (other) { cell.classList.add('other', 'empty'); }
  else {
    if (ds === todayStr) cell.classList.add('today');
    if (ds === selStr)   cell.classList.add('selected');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
  }

  const num = document.createElement('div');
  num.className = 'day-num';
  num.textContent = d;
  cell.appendChild(num);

  if (!other && S.newsData[ds]) {
    const dot = document.createElement('div');
    dot.className = 'news-dot';
    cell.appendChild(dot);
  }

  if (!other) {
    cell.onclick = () => {
      S.selected = real;
      renderCalendar();
      openNews(ds);
    };
  }
  return cell;
}

function changeMonth(dir) {
  S.month += dir;
  if (S.month > 11) { S.month = 0; S.year++; }
  if (S.month < 0)  { S.month = 11; S.year--; }
  renderCalendar();
}

// ===== NOTIFICATION LOGIC =====
function checkNotification() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const todayStr = fmt(S.today);

  const state = S.notifState[todayStr] || { delivered: false, read: false };

  if (!state.delivered && (h > S.settings.hour || (h === S.settings.hour && m >= S.settings.minute))) {
    state.delivered = true;
    state.read = false;
    S.notifState[todayStr] = state;

    // prune old beyond 7 days
    const cutoff = new Date(S.today);
    cutoff.setDate(cutoff.getDate() - 7);
    Object.keys(S.notifState).forEach(k => {
      if (new Date(k) < cutoff) delete S.notifState[k];
    });

    saveNotifState();
    updateDot();

    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      const news = S.newsData[todayStr];
      const firstTitle = news?.trend?.[0]?.title || news?.social?.[0]?.title || '오늘의 뉴스를 확인하세요.';
      try { new Notification('📰 뉴스 브리핑', { body: firstTitle, tag: 'nbr-' + todayStr }); } catch(e) {}
    }
  }

  updateDot();
}

function updateDot() {
  const todayStr = fmt(S.today);
  const state = S.notifState[todayStr];
  const show = state && state.delivered && !state.read;
  document.getElementById('notifDot').classList.toggle('show', !!show);
}

// ===== NOTIFICATION PANEL =====
function toggleNotifPanel() {
  if (S.notifPanelOpen) {
    closeNotifPanel();
  } else {
    openNotifPanel();
  }
}

function openNotifPanel() {
  requestNotifPermission();
  renderNotifList();
  document.getElementById('notifPanel').classList.add('open');
  S.notifPanelOpen = true;
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('open');
  S.notifPanelOpen = false;
}

function renderNotifList() {
  const list = document.getElementById('notifList');
  list.innerHTML = '';

  const dates = getLast7Days();
  const delivered = dates.filter(d => S.notifState[d] && S.notifState[d].delivered);

  if (delivered.length === 0) {
    list.innerHTML = '<div class="notif-empty">아직 알림이 없습니다.<br>매일 설정 시간에 뉴스 알림이 도착해요.</div>';
    return;
  }

  delivered.forEach(dateStr => {
    const state = S.notifState[dateStr];
    const news = S.newsData[dateStr];
    const firstTitle = news?.trend?.[0]?.title || news?.social?.[0]?.title || news?.it?.[0]?.title || '뉴스 없음';

    const item = document.createElement('div');
    item.className = 'notif-item';
    item.innerHTML = `
      <div class="notif-item-top">
        <span class="notif-date">${fmtShort(dateStr)}</span>
        <span class="${state.read ? 'notif-read-badge' : 'notif-unread-badge'}">${state.read ? '읽음' : '새 뉴스'}</span>
      </div>
      <div class="notif-preview">${firstTitle}<span class="notif-preview-suffix"> …</span></div>
    `;
    item.onclick = () => {
      closeNotifPanel();
      markRead(dateStr);
      openNews(dateStr);
    };
    list.appendChild(item);
  });
}

function getLast7Days() {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(S.today);
    d.setDate(d.getDate() - i);
    days.push(fmt(d));
  }
  return days;
}

function markRead(dateStr) {
  if (S.notifState[dateStr]) {
    S.notifState[dateStr].read = true;
    saveNotifState();
  }
  // check if today's is now read → hide dot
  const todayStr = fmt(S.today);
  if (dateStr === todayStr) updateDot();
}

async function requestNotifPermission() {
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

// ===== NEWS POPUP =====
function openNews(dateStr) {
  S.currentNewsDate = dateStr;
  document.getElementById('newsDateTitle').textContent = fmtDisplay(dateStr);
  renderNewsContent();
  document.getElementById('newsBg').classList.add('open');
}

function closeNews() {
  document.getElementById('newsBg').classList.remove('open');
  if (S.currentNewsDate) {
    markRead(S.currentNewsDate);
    S.currentNewsDate = null;
  }
}

function closeNewsOnBg(e) {
  if (e.target === document.getElementById('newsBg')) closeNews();
}

function renderNewsContent() {
  const content = document.getElementById('newsContent');
  const data = S.newsData[S.currentNewsDate];

  if (!data) {
    content.innerHTML = '<div class="no-news">이 날짜의 뉴스 데이터가 없습니다.</div>';
    return;
  }

  const cats = ['trend','social','it','global'];
  let html = '';

  cats.forEach(cat => {
    const articles = data[cat] || [];
    if (!articles.length) return;
    const m = CAT_META[cat];
    html += `<div class="news-section">
      <div class="news-section-hd" style="background:${m.color}">
        <span class="news-section-icon">${m.icon}</span>
        <span class="news-section-label">${m.label}</span>
      </div>`;
    articles.forEach((a, i) => {
      const id = `${cat}_${i}`;
      html += `
      <div class="acc-item">
        <div class="acc-title" onclick="toggleAcc('${id}')">
          <span class="acc-title-text">${a.title}</span>
          <span class="acc-arrow" id="arrow_${id}">›</span>
        </div>
        <div class="acc-body" id="body_${id}">
          <p class="acc-summary">${formatSummary(a.summary)}</p>
          <div class="acc-source">출처 · ${a.source}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  content.innerHTML = html || '<div class="no-news">뉴스 데이터가 없습니다.</div>';
  content.scrollTop = 0;
}

function formatSummary(text) {
  // Bold numbers and key phrases for readability
  return text
    .replace(/(\d+\.?\d*[%억만조원명개])/g, '<b>$1</b>')
    .replace(/(전년 대비|전월 대비|역대 최고|역대 최저|처음으로|공식 발표|잠정 합의)/g, '<b>$1</b>');
}

function toggleAcc(id) {
  const body = document.getElementById(`body_${id}`);
  const arrow = document.getElementById(`arrow_${id}`);
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.acc-body.open').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.acc-arrow.open').forEach(a => a.classList.remove('open'));
  if (!isOpen) {
    body.classList.add('open');
    arrow.classList.add('open');
  }
}

// ===== MENU =====
function openMenu() {
  document.getElementById('menuDrawer').classList.add('open');
  document.getElementById('menuBg').classList.add('open');
}
function closeMenu() {
  document.getElementById('menuDrawer').classList.remove('open');
  document.getElementById('menuBg').classList.remove('open');
}

// ===== TIME MODAL =====
function openTimeModal() {
  const hs = document.getElementById('hourSelect');
  const ms = document.getElementById('minuteSelect');
  hs.value = S.settings.hour;
  ms.value = S.settings.minute;
  document.getElementById('timeModalBg').classList.add('open');
}
function closeTimeModal() {
  document.getElementById('timeModalBg').classList.remove('open');
}
function closeTimeModalBg(e) {
  if (e.target === document.getElementById('timeModalBg')) closeTimeModal();
}
function saveTime() {
  S.settings.hour   = parseInt(document.getElementById('hourSelect').value);
  S.settings.minute = parseInt(document.getElementById('minuteSelect').value);
  localStorage.setItem('nbr_settings', JSON.stringify(S.settings));

  const todayStr = fmt(S.today);
  if (S.notifState[todayStr]) {
    S.notifState[todayStr].delivered = false;
  }
  saveNotifState();

  const hh = S.settings.hour;
  const mm = String(S.settings.minute).padStart(2,'0');
  closeTimeModal();
  showSuccessPopup(`오전 ${hh}시 ${mm}분`);

  try { checkNotification(); } catch(e) {}
}

// ===== SUCCESS POPUP =====
function showSuccessPopup(timeStr) {
  const popup = document.getElementById('successPopup');
  document.getElementById('successTime').textContent = timeStr;
  popup.classList.add('show');
  clearTimeout(popup._t);
  popup._t = setTimeout(() => {
    popup.style.opacity = '0';
    popup.style.transition = 'opacity 0.3s';
    setTimeout(() => {
      popup.classList.remove('show');
      popup.style.opacity = '';
      popup.style.transition = '';
    }, 300);
  }, 1800);
}

// ===== SWIPE TO CLOSE =====
function setupSwipe() {
  const sheet = document.getElementById('newsSheet');
  let startY = 0;
  sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 80) closeNews();
  }, { passive: true });
}

// ===== CLOSE NOTIF PANEL ON OUTSIDE CLICK =====
document.addEventListener('click', e => {
  if (!S.notifPanelOpen) return;
  const panel = document.getElementById('notifPanel');
  const bell  = document.getElementById('bellBtn');
  if (!panel.contains(e.target) && !bell.contains(e.target)) {
    closeNotifPanel();
  }
}, true);

// ===== START =====
init();
</script>
