<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리의 44곡</title>
<meta name="description" content="44곡의 순서를 함께 정하는 목록. 바꾼 순서는 링크에 담겨 그대로 공유됩니다.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="우리의 44곡">
<meta property="og:description" content="44곡의 순서를 함께 정하는 목록.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F1F3EF;
    --surface:#FFFFFF;
    --surface-2:#E9ECE6;
    --ink:#1B211C;
    --muted:#6B7469;
    --faint:#949C8F;
    --line:#DCE0D6;
    --accent:#2F6B4F;
    --accent-ink:#FFFFFF;
    --accent-soft:#E1EBE3;
    --gold:#A9762B;
    --shadow-lift:0 12px 28px rgba(27,33,28,.18);
    --radius:9px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131711;
      --surface:#1C211A;
      --surface-2:#232921;
      --ink:#E8EDE4;
      --muted:#99A393;
      --faint:#78826F;
      --line:#2E352B;
      --accent:#7CC79C;
      --accent-ink:#11170F;
      --accent-soft:#243020;
      --gold:#DCA94E;
      --shadow-lift:0 14px 30px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131711;
    --surface:#1C211A;
    --surface-2:#232921;
    --ink:#E8EDE4;
    --muted:#99A393;
    --faint:#78826F;
    --line:#2E352B;
    --accent:#7CC79C;
    --accent-ink:#11170F;
    --accent-soft:#243020;
    --gold:#DCA94E;
    --shadow-lift:0 14px 30px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  .wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

  header{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:20;
    background:var(--bg);
    padding-block:22px 12px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);font-weight:600;margin:0 0 6px;
  }
  h1{
    font-family:"Hahmlet",Georgia,serif;
    font-weight:700;font-size:clamp(25px,6.4vw,34px);
    letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.2;
  }
  .sub{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.55}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
  .status{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;color:var(--muted);
    background:var(--surface-2);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;min-height:28px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.live{background:var(--accent)}
  .dot.warn{background:var(--gold)}
  .spacer{flex:1 1 auto}
  button.act{
    font:inherit;font-size:12px;font-weight:500;
    color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;cursor:pointer;min-height:32px;
  }
  button.act:hover{background:var(--surface-2)}
  button.act.primary{
    background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
    font-weight:600;
  }
  button.act.primary:hover{filter:brightness(1.06)}

  ol{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
  li.row{
    display:grid;
    grid-template-columns:30px 24px 1fr auto;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:9px 8px 9px 10px;
    touch-action:pan-y;
    will-change:transform;
  }
  li.row.lift{
    box-shadow:var(--shadow-lift);
    border-color:var(--accent);
    position:relative;z-index:10;
    pointer-events:none;
  }
  li.row.moved{animation:flash .9s ease}
  @keyframes flash{
    from{background:var(--accent-soft)}
    to{background:var(--surface)}
  }
  @media (prefers-reduced-motion: reduce){
    li.row.moved{animation:none}
  }

  .rank{
    font-family:"Hahmlet",Georgia,serif;
    font-weight:500;font-size:16px;
    font-variant-numeric:tabular-nums;
    color:var(--gold);text-align:right;
  }
  .grip{
    width:26px;height:34px;display:flex;align-items:center;justify-content:center;
    cursor:grab;color:var(--faint);flex:none;
    border:0;background:none;padding:0;
  }
  .grip:active{cursor:grabbing}
  .grip svg{display:block}

  .song{min-width:0;line-height:1.35;padding-block:1px}
  .song .t{font-size:15px;font-weight:500;overflow-wrap:anywhere}
  .song .a{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

  .nudge{display:flex;gap:0;flex:none}
  .nudge button{
    width:28px;height:30px;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:7px;
    background:none;color:var(--muted);cursor:pointer;
  }
  .nudge button.edge{color:var(--faint)}
  .nudge button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
  .nudge button:disabled{opacity:.25;cursor:default}
  .nudge svg{display:block}

  :is(button,li.row):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    background:var(--ink);color:var(--bg);
    font-size:13px;font-weight:500;
    padding:10px 16px;border-radius:999px;
    box-shadow:var(--shadow-lift);
    z-index:50;max-width:calc(100% - 32px);text-align:center;
  }

  footer{
    margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--faint);font-size:12px;line-height:1.7;
  }
  footer b{color:var(--muted);font-weight:600}
  kbd{
    font:inherit;font-size:11px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">함께 정하는 순서</p>
    <h1>우리의 44곡</h1>
    <p class="sub">손잡이를 끌거나 화살표를 눌러 순서를 바꾼 뒤, 링크를 복사해 보내세요. 링크 안에 순서가 담겨 갑니다.</p>
    <div class="bar">
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">기본 순서</span></span>
      <span class="spacer"></span>
      <button class="act" id="reset">처음 순서로</button>
      <button class="act primary" id="share">이 순서로 링크 복사</button>
    </div>
  </header>

  <ol id="list" aria-label="노래 순서 목록"></ol>

  <footer>
    <b>44곡</b> · 드래그로 옮기거나, 행을 선택하고 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>Home</kbd> <kbd>End</kbd> 로도 옮길 수 있어요.
    바꾼 순서는 이 기기에 자동 저장되고, <b>링크를 복사해 보내야</b> 상대에게 전달됩니다.
  </footer>
</div>

<script>
(function(){
  "use strict";

  var TITLES = [
    "가을밤에 든 생각","모두 행복해져라","개화","꿈나라 별나라","너에게 닿기를",
    "당장 널 만나러 가지 않으면","동화_멜로망스","러브 레시피_클래지콰이","마음_아이유",
    "사람들은 다 그래 맛있는 걸 먹","사랑_최유리","사랑의이름으로!(feat. 카리나)",
    "사랑하자_소수빈","선샤인코메디클럽_잔나비","소문의 낙원_악뮤","아니근데진짜",
    "아윌다이포유x3_잔나비","The Luckiest","엔플라잉_Flashback","연의 편지_이수현",
    "영원_디오","우리사랑은 필름같았으면","우리사랑은!_찰리빈웍스",
    "이름이 맘에 든다는 이유만으로","일곱시에 들어줘_부승관","찬란한 하루_멜로망스",
    "초대_멜로망스","초록을거머쥔우리는_잔나비","햇빛 Bless You_악뮤","Antifreeze_백예린",
    "Christmas Tree","Day 1","free love_HONNE","Love Shine_검졍치마","LOVE YA!_혁오",
    "Mars_도경수","Pisces_백예린","Popcorn_도경수","Romeo n Juliet","See Your Eyes_잔나비",
    "She_잔나비","Steal The Show","TOGETHER!","Vivid LaLa Love"
  ];

  // One URL-safe character per song, so a whole 44-song order is 44 characters
  // of hash — short enough to paste into any chat app without it wrapping.
  var ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  var STORE_KEY = "playlist44.order";

  var SONGS = TITLES.map(function(raw){
    var cut = raw.indexOf("_");
    return {
      main: cut === -1 ? raw : raw.slice(0, cut),
      side: cut === -1 ? "" : raw.slice(cut + 1)
    };
  });
  if (SONGS.length > ALPHA.length) throw new Error("곡이 64개를 넘으면 인코딩을 늘려야 합니다");

  var DEFAULT_ORDER = SONGS.map(function(_, i){ return i; });
  var order = DEFAULT_ORDER.slice();

  var listEl = document.getElementById("list");
  var dotEl = document.getElementById("dot");
  var statusEl = document.getElementById("statusText");
  var flashIndex = null;

  /* ---------------- order <-> text ---------------- */

  function encode(o){
    return o.map(function(i){ return ALPHA.charAt(i); }).join("");
  }

  // Tolerant on purpose: a truncated or stale code still yields a usable
  // order instead of silently falling back to the default.
  function decode(code){
    if (typeof code !== "string" || !code) return null;
    var seen = {}, out = [], ok = false;
    for (var n = 0; n < code.length; n++){
      var idx = ALPHA.indexOf(code.charAt(n));
      if (idx < 0 || idx >= SONGS.length || seen[idx]) continue;
      seen[idx] = 1; out.push(idx); ok = true;
    }
    if (!ok) return null;
    DEFAULT_ORDER.forEach(function(i){ if (!seen[i]) out.push(i); });
    return out;
  }

  function readHash(){
    var m = /(?:^#|[#&])o=([A-Za-z0-9\-_]+)/.exec(location.hash || "");
    return m ? decode(m[1]) : null;
  }

  function shareUrl(){
    return location.origin + location.pathname + location.search + "#o=" + encode(order);
  }

  function persist(){
    try { localStorage.setItem(STORE_KEY, encode(order)); } catch (_){}
    try {
      history.replaceState(null, "", "#o=" + encode(order));
    } catch (_){
      location.hash = "o=" + encode(order);
    }
  }

  /* ---------------- rendering ---------------- */

  function gripSvg(){
    return '<svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor" aria-hidden="true">' +
      '<circle cx="4" cy="3" r="1.5"/><circle cx="10" cy="3" r="1.5"/>' +
      '<circle cx="4" cy="8" r="1.5"/><circle cx="10" cy="8" r="1.5"/>' +
      '<circle cx="4" cy="13" r="1.5"/><circle cx="10" cy="13" r="1.5"/></svg>';
  }
  function svg(paths){
    return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      paths + '</svg>';
  }

  // key, label, icon, and where in the list the button lands the row.
  var MOVES = [
    { key:"top",    label:"맨 위로",   edge:true,
      icon:svg('<path d="M3 2.5h8"/><path d="M7 11.5V5.5"/><path d="M4.4 8L7 5.4 9.6 8"/>') },
    { key:"up",     label:"위로",      edge:false,
      icon:svg('<path d="M3 9l4-4 4 4"/>') },
    { key:"down",   label:"아래로",    edge:false,
      icon:svg('<path d="M3 5l4 4 4-4"/>') },
    { key:"bottom", label:"맨 아래로", edge:true,
      icon:svg('<path d="M3 11.5h8"/><path d="M7 2.5v6"/><path d="M4.4 6L7 8.6 9.6 6"/>') }
  ];

  function targetIndex(key, from, len){
    if (key === "top") return 0;
    if (key === "bottom") return len - 1;
    return key === "up" ? from - 1 : from + 1;
  }

  function nudgeBtn(songIndex, spec){
    var b = document.createElement("button");
    b.type = "button";
    b.className = spec.edge ? "edge" : "";
    b.dataset.move = spec.key;
    b.setAttribute("aria-label", SONGS[songIndex].main + " " + spec.label);
    b.title = spec.label;
    b.innerHTML = spec.icon;
    b.addEventListener("click", function(e){ e.preventDefault(); move(songIndex, spec.key); });
    return b;
  }

  function rowFor(songIndex){
    var s = SONGS[songIndex];
    var li = document.createElement("li");
    li.className = "row";
    li.dataset.song = String(songIndex);
    li.tabIndex = 0;

    var rank = document.createElement("div");
    rank.className = "rank";
    li.appendChild(rank);

    var grip = document.createElement("button");
    grip.className = "grip";
    grip.type = "button";
    grip.setAttribute("aria-label", s.main + " 끌어서 옮기기");
    grip.innerHTML = gripSvg();
    li.appendChild(grip);

    var song = document.createElement("div");
    song.className = "song";
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = s.main;
    song.appendChild(t);
    if (s.side){
      var a = document.createElement("div");
      a.className = "a";
      a.textContent = s.side;
      song.appendChild(a);
    }
    li.appendChild(song);

    var nudge = document.createElement("div");
    nudge.className = "nudge";
    MOVES.forEach(function(spec){ nudge.appendChild(nudgeBtn(songIndex, spec)); });
    li.appendChild(nudge);

    return li;
  }

  function render(){
    var frag = document.createDocumentFragment();
    order.forEach(function(i){ frag.appendChild(rowFor(i)); });
    listEl.replaceChildren(frag);
    paint();
    if (flashIndex !== null){
      var el = listEl.querySelector('li.row[data-song="' + flashIndex + '"]');
      if (el) el.classList.add("moved");
      flashIndex = null;
    }
  }

  function paint(){
    var rows = listEl.children;
    for (var i = 0; i < rows.length; i++){
      rows[i].querySelector(".rank").textContent = i + 1;
      var atTop = (i === 0), atEnd = (i === rows.length - 1);
      var group = rows[i].querySelector(".nudge");
      group.querySelector('[data-move="top"]').disabled = atTop;
      group.querySelector('[data-move="up"]').disabled = atTop;
      group.querySelector('[data-move="down"]').disabled = atEnd;
      group.querySelector('[data-move="bottom"]').disabled = atEnd;
    }
  }

  function readOrderFromDom(){
    return Array.prototype.map.call(listEl.children, function(el){
      return Number(el.dataset.song);
    });
  }

  function setStatus(text, kind){
    statusEl.textContent = text;
    dotEl.className = "dot" + (kind ? " " + kind : "");
  }

  function markChanged(){
    persist();
    var isDefault = order.join(",") === DEFAULT_ORDER.join(",");
    setStatus(isDefault ? "기본 순서" : "바뀐 순서 — 링크를 복사해 보내세요", isDefault ? null : "live");
  }

  /* ---------------- mutations ---------------- */

  function move(songIndex, key){
    var from = order.indexOf(songIndex);
    if (from < 0) return;
    var to = targetIndex(key, from, order.length);
    if (to < 0 || to >= order.length || to === from) return;
    order.splice(to, 0, order.splice(from, 1)[0]);
    flashIndex = songIndex;
    render();
    var el = listEl.querySelector('li.row[data-song="' + songIndex + '"]');
    if (el){
      var btn = el.querySelector('.nudge button[data-move="' + key + '"]');
      if (btn && !btn.disabled) btn.focus(); else el.focus();
      // A jump to either end lands off-screen; bring the row into view so the
      // press is visibly confirmed.
      if (key === "top" || key === "bottom"){
        var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        el.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
      }
    }
    markChanged();
  }

  document.getElementById("reset").addEventListener("click", function(){
    order = DEFAULT_ORDER.slice();
    render();
    markChanged();
  });

  listEl.addEventListener("keydown", function(e){
    var li = e.target.closest ? e.target.closest("li.row") : null;
    if (!li || !listEl.contains(li)) return;
    var KEYS = { ArrowUp:"up", ArrowDown:"down", Home:"top", End:"bottom" };
    var key = KEYS[e.key];
    if (key){
      e.preventDefault();
      move(Number(li.dataset.song), key);
      var again = listEl.querySelector('li.row[data-song="' + li.dataset.song + '"]');
      if (again) again.focus();
    }
  });

  /* ---------------- sharing ---------------- */

  var toastTimer = null;
  function toast(msg){
    var old = document.querySelector(".toast");
    if (old) old.remove();
    clearTimeout(toastTimer);
    var el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("role", "status");
    el.textContent = msg;
    document.body.appendChild(el);
    toastTimer = setTimeout(function(){ el.remove(); }, 2600);
  }

  document.getElementById("share").addEventListener("click", async function(){
    var url = shareUrl();
    try {
      await navigator.clipboard.writeText(url);
      toast("링크를 복사했어요 — 붙여넣어 보내세요");
      return;
    } catch (_){}
    // Clipboard is blocked outside a secure context or without permission;
    // a share sheet works on phones, and selectable text is the last resort.
    if (navigator.share){
      try { await navigator.share({ title: "우리의 44곡", url: url }); return; } catch (_){}
    }
    window.prompt("이 주소를 복사해 보내세요", url);
  });

  /* ---------------- pointer drag ---------------- */

  var drag = null;

  listEl.addEventListener("pointerdown", function(e){
    if (e.button !== 0) return;
    var grip = e.target.closest ? e.target.closest(".grip") : null;
    if (!grip) return;
    var li = grip.closest("li.row");
    if (!li) return;
    e.preventDefault();

    var rect = li.getBoundingClientRect();
    drag = {
      li: li,
      pointerId: e.pointerId,
      grabOffset: e.clientY - rect.top,
      dy: 0,
      pointerY: e.clientY,
      scrollTimer: null
    };
    li.classList.add("lift");
    document.body.style.userSelect = "none";
    try { listEl.setPointerCapture(e.pointerId); } catch (_){}
    followPointer();
    drag.scrollTimer = setInterval(edgeScroll, 16);
  });

  listEl.addEventListener("pointermove", function(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    e.preventDefault();
    drag.pointerY = e.clientY;
    followPointer();
    reorderUnderPointer(e.clientX);
  });

  function endDrag(e){
    if (!drag || (e && e.pointerId !== drag.pointerId)) return;
    var li = drag.li;
    clearInterval(drag.scrollTimer);
    try { listEl.releasePointerCapture(drag.pointerId); } catch (_){}
    li.classList.remove("lift");
    li.style.transform = "";
    document.body.style.userSelect = "";
    drag = null;

    var next = readOrderFromDom();
    if (next.join(",") !== order.join(",")){
      order = next;
      paint();
      markChanged();
    }
    li.focus();
  }
  listEl.addEventListener("pointerup", endDrag);
  listEl.addEventListener("pointercancel", endDrag);

  // Keeps the lifted row glued to the finger even after the DOM reshuffles
  // beneath it: measure where it actually sits, then correct the offset.
  function followPointer(){
    if (!drag) return;
    var rect = drag.li.getBoundingClientRect();
    var restingTop = rect.top - drag.dy;
    drag.dy = (drag.pointerY - drag.grabOffset) - restingTop;
    drag.li.style.transform = "translateY(" + drag.dy + "px)";
  }

  function reorderUnderPointer(x){
    if (!drag) return;
    var under = document.elementFromPoint(x, drag.pointerY);
    var target = under && under.closest ? under.closest("li.row") : null;
    if (!target || target === drag.li || !listEl.contains(target)) return;
    var r = target.getBoundingClientRect();
    var before = drag.pointerY < r.top + r.height / 2;
    var ref = before ? target : target.nextSibling;
    if (ref === drag.li) return;
    listEl.insertBefore(drag.li, ref);
    followPointer();
    paint();
  }

  function edgeScroll(){
    if (!drag) return;
    var margin = 72, y = drag.pointerY, h = window.innerHeight, delta = 0;
    if (y < margin) delta = -Math.ceil((margin - y) / 5);
    else if (y > h - margin) delta = Math.ceil((y - (h - margin)) / 5);
    if (!delta) return;
    var before = window.scrollY;
    window.scrollBy(0, delta);
    if (window.scrollY !== before){
      followPointer();
      reorderUnderPointer(window.innerWidth / 2);
    }
  }

  /* ---------------- boot ---------------- */

  var fromLink = readHash();
  if (fromLink){
    order = fromLink;
    render();
    setStatus("공유받은 순서", "live");
  } else {
    var saved = null;
    try { saved = decode(localStorage.getItem(STORE_KEY)); } catch (_){}
    if (saved){
      order = saved;
      render();
      setStatus("이 기기에 저장된 순서", "live");
    } else {
      render();
      setStatus("기본 순서", null);
    }
  }

  // Someone pasting a different link into the same tab should land on it.
  window.addEventListener("hashchange", function(){
    var next = readHash();
    if (next && next.join(",") !== order.join(",")){
      order = next;
      render();
      setStatus("공유받은 순서", "live");
    }
  });
})();
</script>
</body>
</html>
