<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="뉴스 브리핑">
<title>뉴스 브리핑</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1a1a2e;
  --gold:#e0c97f;
  --bg:#f8f9fa;
  --white:#ffffff;
  --trend:#ff6b6b;
  --social:#4ecdc4;
  --it:#45b7d1;
  --global:#96ceb4;
  --text:#1a1a2e;
  --sub:#666;
  --border:#eee;
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;display:flex;flex-direction:column}

/* HEADER */
header{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--navy);color:var(--white);
  padding:0 16px;height:56px;flex-shrink:0;position:relative;z-index:10;
}
.header-left,.header-right{display:flex;align-items:center;gap:4px;width:56px}
.header-right{justify-content:flex-end}
.header-title{font-size:17px;font-weight:700;color:var(--gold);letter-spacing:0.5px}
.icon-btn{
  background:none;border:none;color:var(--white);cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;padding:0;position:relative;
}
.icon-btn:active{background:rgba(255,255,255,0.1);transform:scale(0.9)}
.icon-btn{transition:transform 0.1s,-webkit-tap-highlight-color 0s}
.hamburger{display:flex;flex-direction:column;gap:5px;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px}
.bell-icon{font-size:22px;line-height:1}
.notif-dot{
  position:absolute;top:6px;right:6px;
  width:9px;height:9px;border-radius:50%;
  background:#e53935;border:1.5px solid var(--navy);
  display:none;
}
.notif-dot.show{display:block}
.loading-ring{
  display:none;width:16px;height:16px;
  border:2px solid rgba(224,201,127,0.3);
  border-top-color:var(--gold);
  border-radius:50%;animation:spin 0.8s linear infinite;
  margin-left:6px;
}
.loading-ring.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* CALENDAR */
.calendar-wrap{flex:1;display:flex;flex-direction:column;background:var(--white);overflow:hidden}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 6px}
.cal-nav-btn{
  background:none;border:none;cursor:pointer;
  color:var(--navy);font-size:22px;padding:6px 12px;line-height:1;border-radius:8px;
}
.cal-nav-btn:active{background:var(--bg)}
.cal-title{font-size:17px;font-weight:700;color:var(--navy)}
.weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  padding:0 6px;margin-bottom:2px;
}
.wd{text-align:center;font-size:11px;font-weight:600;color:#999;padding:3px 0}
.wd:first-child{color:#e53935}
.wd:last-child{color:#1565c0}
.days-grid{
  flex:1;display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,1fr);
  padding:0 6px 6px;
}
.day{
  display:flex;flex-direction:column;align-items:center;
  padding-top:3px;cursor:pointer;border-radius:8px;
  transition:background 0.15s,transform 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.day:active{background:var(--bg);transform:scale(0.92)}
.day.empty{cursor:default;pointer-events:none}
.day-num{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;font-weight:500;color:var(--text);
}
.day.other .day-num{color:#ccc}
.day.sun:not(.other) .day-num{color:#e53935}
.day.sat:not(.other) .day-num{color:#1565c0}
.day.today .day-num{background:var(--navy);color:var(--white);font-weight:700}
.day.selected:not(.today) .day-num{background:var(--gold);color:var(--navy);font-weight:700}
.day.today.selected .day-num{background:var(--gold);color:var(--navy)}
.day.sun.today .day-num,.day.sat.today .day-num{color:var(--white)}
.day.sun.selected .day-num,.day.sat.selected .day-num{color:var(--navy)}
.news-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--gold);margin-top:2px;
}

/* MENU DRAWER */
.menu-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200}
.menu-bg.open{display:block}
.menu-drawer{
  position:fixed;top:0;left:-270px;width:270px;height:100%;
  background:var(--navy);z-index:201;
  transition:left 0.28s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;padding:0;
}
.menu-drawer.open{left:0}
.menu-head{
  padding:60px 24px 24px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.menu-brand{color:var(--gold);font-size:22px;font-weight:800;letter-spacing:1px}
.menu-sub{color:rgba(255,255,255,0.45);font-size:12px;margin-top:4px}
.menu-list{list-style:none;padding:12px 12px;flex:1}
.menu-list li{margin-bottom:2px}
.menu-item-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;background:none;border:none;
  color:rgba(255,255,255,0.8);text-decoration:none;
  padding:13px 12px;border-radius:10px;font-size:15px;
  cursor:pointer;text-align:left;font-family:inherit;
  transition:background 0.15s,transform 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.menu-item-btn:active{background:rgba(255,255,255,0.12);color:var(--white);transform:scale(0.97)}
.menu-item-icon{font-size:18px;width:24px;text-align:center}

/* TIME SETTING MODAL */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.5);z-index:300;
  align-items:center;justify-content:center;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--white);border-radius:20px;
  padding:28px 24px;width:88%;max-width:340px;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
.modal-title{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--sub);margin-bottom:22px}
.time-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:24px}
.time-label{font-size:14px;color:var(--sub);white-space:nowrap}
.time-select{
  border:2px solid var(--border);border-radius:10px;
  padding:10px 8px;font-size:16px;font-weight:700;
  color:var(--navy);background:var(--bg);outline:none;
  -webkit-appearance:none;appearance:none;
  text-align:center;min-width:70px;
}
.time-select:focus{border-color:var(--gold)}
.modal-btns{display:flex;gap:10px}
.btn-cancel{
  flex:1;padding:13px;border:2px solid var(--border);
  background:none;border-radius:12px;font-size:15px;
  color:var(--sub);cursor:pointer;font-weight:600;font-family:inherit;
  transition:transform 0.1s,opacity 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.btn-cancel:active{transform:scale(0.95);opacity:0.7}
.btn-save{
  flex:2;padding:13px;background:var(--navy);
  border:none;border-radius:12px;font-size:15px;
  color:var(--white);cursor:pointer;font-weight:700;font-family:inherit;
  transition:transform 0.1s,background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.btn-save:active{transform:scale(0.95);background:#2d2d4e}

/* SAVE SUCCESS POPUP */
.success-popup{
  display:none;position:fixed;inset:0;
  z-index:500;align-items:center;justify-content:center;
  pointer-events:none;
}
.success-popup.show{display:flex}
.success-card{
  background:var(--white);border-radius:24px;
  padding:32px 28px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,0.18);
  animation:popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  min-width:200px;
}
@keyframes popIn{
  from{opacity:0;transform:scale(0.7)}
  to{opacity:1;transform:scale(1)}
}
.success-icon{font-size:48px;margin-bottom:12px;display:block}
.success-title{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:6px}
.success-time{font-size:22px;font-weight:800;color:var(--gold)}

/* NOTIFICATION DROPDOWN */
.notif-panel{
  display:none;position:fixed;top:56px;right:0;
  width:min(340px,100vw);max-height:calc(100vh - 56px);
  background:var(--white);z-index:150;
  box-shadow:-2px 4px 20px rgba(0,0,0,0.15);
  border-radius:0 0 0 16px;overflow:hidden;
  flex-direction:column;
  animation:slideDown 0.2s ease;
}
.notif-panel.open{display:flex}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-header{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.notif-header-title{font-size:15px;font-weight:700;color:var(--navy)}
.notif-close-btn{
  background:none;border:none;font-size:16px;
  color:var(--sub);cursor:pointer;padding:4px;
}
.notif-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.notif-item{
  padding:14px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background 0.15s;
}
.notif-item:active{background:var(--bg)}
.notif-item:last-child{border-bottom:none}
.notif-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.notif-date{font-size:12px;font-weight:700;color:var(--sub)}
.notif-unread-badge{
  font-size:10px;font-weight:700;color:var(--white);
  background:#e53935;border-radius:10px;padding:2px 7px;
}
.notif-read-badge{
  font-size:10px;font-weight:700;color:var(--sub);
  background:var(--bg);border-radius:10px;padding:2px 7px;
}
.notif-preview{
  font-size:13px;color:var(--text);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.notif-preview-suffix{color:var(--sub)}
.notif-empty{padding:32px 16px;text-align:center;color:var(--sub);font-size:14px}

/* NEWS POPUP (bottom sheet) */
.news-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.5);z-index:250;
  align-items:flex-end;
}
.news-bg.open{display:flex}
.news-sheet{
  background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-height:92vh;
  display:flex;flex-direction:column;
  position:relative;
  animation:slideUp 0.28s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.news-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 0}
.news-close{
  position:absolute;top:14px;right:16px;
  background:#f0f0f0;border:none;border-radius:50%;
  width:34px;height:34px;font-size:17px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#555;
  z-index:20;
  -webkit-tap-highlight-color:transparent;
  transition:background 0.15s;
}
.news-close:active{background:#ddd}
.news-head{
  padding:10px 60px 12px 20px;
  border-bottom:1px solid #f0f0f0;flex-shrink:0;
}
.news-date-title{font-size:16px;font-weight:800;color:var(--navy)}
.news-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 40px}

/* ACCORDION */
.news-section{margin-bottom:14px}
.news-section-hd{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:10px;margin-bottom:2px;
}
.news-section-icon{font-size:15px}
.news-section-label{font-size:13px;font-weight:800;color:var(--white)}
.acc-item{border-bottom:1px solid var(--border)}
.acc-item:last-child{border-bottom:none}
.acc-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 2px;cursor:pointer;gap:12px;
  -webkit-tap-highlight-color:transparent;
  transition:opacity 0.1s;
}
.acc-title:active{opacity:0.5}
.acc-title-text{font-size:14px;font-weight:600;color:var(--navy);line-height:1.45;flex:1}
.acc-arrow{
  font-size:20px;color:#bbb;flex-shrink:0;line-height:1;
  transition:transform 0.22s cubic-bezier(0.4,0,0.2,1),color 0.2s;
  font-weight:300;
}
.acc-arrow.open{transform:rotate(90deg);color:var(--navy)}
.acc-body{
  max-height:0;overflow:hidden;
  transition:max-height 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.25s;
  opacity:0;
}
.acc-body.open{max-height:400px;opacity:1}
.acc-summary{
  font-size:13.5px;color:#444;line-height:1.75;
  padding-bottom:4px;word-break:keep-all;
}
.acc-summary b{color:var(--navy);font-weight:700}
.acc-source{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--gold);font-weight:600;
  margin-top:8px;margin-bottom:14px;
  float:right;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  text-decoration:underline;text-underline-offset:2px;
}
.scrap-btn{font-size:16px;padding:2px 6px;opacity:0.35;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;transition:opacity 0.15s,transform 0.15s}
.scrap-btn.scraped{opacity:1}
.scrap-btn:active{transform:scale(1.3)}

.scrap-panel{
  display:none;position:fixed;inset:0;
  background:var(--bg);z-index:200;
  flex-direction:column;
}
.scrap-panel.open{display:flex;animation:slideInRight 0.25s cubic-bezier(0.4,0,0.2,1)}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.scrap-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:var(--white);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.scrap-back-btn{
  background:none;border:none;font-size:22px;color:var(--navy);
  cursor:pointer;padding:0 4px;line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.scrap-header-title{font-size:17px;font-weight:800;color:var(--navy);flex:1}
.scrap-count{font-size:12px;color:var(--sub);font-weight:500}
.scrap-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 60px}
.scrap-date-group{margin-bottom:24px}
.scrap-date-label{
  font-size:12px;font-weight:700;color:var(--sub);
  margin-bottom:10px;padding:4px 10px;
  background:var(--white);border-radius:8px;
  display:inline-block;border:1px solid var(--border);
}
.scrap-article{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px;margin-bottom:10px;
  background:var(--white);border-radius:14px;
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
}
.scrap-cat-badge{
  flex-shrink:0;padding:3px 8px;border-radius:8px;
  font-size:10px;font-weight:700;color:#fff;margin-top:2px;
  white-space:nowrap;
}
.scrap-article-body{flex:1;cursor:pointer;min-width:0}
.scrap-article-title{
  font-size:14px;font-weight:700;color:var(--navy);
  line-height:1.45;word-break:keep-all;margin-bottom:4px;
}
.scrap-article-summary{
  font-size:12.5px;color:#555;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:6px;
}
.scrap-article-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.scrap-article-link{
  font-size:11px;color:var(--gold);font-weight:600;
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;
}
.scrap-remove-btn{
  background:#f5f5f5;border:none;border-radius:50%;
  width:28px;height:28px;font-size:13px;color:#aaa;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:background 0.15s;
}
.scrap-remove-btn:active{background:#ffe0e0;color:#e53935}
.scrap-empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;line-height:2}

.news-card{
  background:var(--bg);border-radius:14px;
  padding:14px;margin-bottom:10px;
}
.news-card-cat{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:var(--white);
  padding:3px 8px;border-radius:10px;margin-bottom:8px;
}
.news-card-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px;line-height:1.4}
.news-card-summary{font-size:13px;color:var(--sub);line-height:1.55}
.news-card-source{
  font-size:11px;color:#aaa;text-align:right;
  margin-top:8px;
}
.news-loading{
  display:flex;align-items:center;justify-content:center;
  padding:40px;flex-direction:column;gap:12px;
  color:var(--sub);font-size:14px;
}
.loading-spinner{
  width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--navy);border-radius:50%;
  animation:spin 0.8s linear infinite;
}
.no-news{padding:32px 16px;text-align:center;color:var(--sub);font-size:14px}

/* TOAST */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,46,0.92);color:var(--white);
  padding:10px 20px;border-radius:20px;font-size:14px;
  z-index:500;opacity:0;transition:opacity 0.25s;
  white-space:nowrap;pointer-events:none;max-width:90vw;
  text-align:center;
}
.toast.show{opacity:1}
/* ===== AUTH OVERLAY ===== */
.auth-overlay{
  display:none;position:fixed;inset:0;z-index:1000;
  background:var(--navy);
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
.auth-overlay.show{display:flex}
.auth-logo{font-size:32px;font-weight:900;color:var(--gold);letter-spacing:-1px;margin-bottom:4px}
.auth-tagline{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:40px}
.auth-card{
  background:var(--white);border-radius:24px;padding:28px 24px;
  width:100%;max-width:360px;
  animation:fadeIn 0.25s ease;
}
.auth-tab-row{display:flex;gap:0;margin-bottom:24px;background:#f0f0f0;border-radius:12px;padding:4px}
.auth-tab{
  flex:1;padding:9px;border:none;background:none;border-radius:9px;
  font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;
  font-family:inherit;transition:all 0.18s;
  -webkit-tap-highlight-color:transparent;
}
.auth-tab.active{background:var(--white);color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.auth-field{margin-bottom:14px}
.auth-label{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;display:block}
.auth-input{
  width:100%;border:2px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:15px;color:var(--navy);
  background:var(--bg);outline:none;box-sizing:border-box;font-family:inherit;
}
.auth-input:focus{border-color:var(--gold)}
.auth-error{font-size:12px;color:#e53935;margin-top:4px;min-height:16px}
.auth-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:var(--navy);color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:6px;
  transition:background 0.15s,transform 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.auth-btn:active{background:#2d2d4e;transform:scale(0.98)}
.auth-loading{opacity:0.6;pointer-events:none}

/* ===== MY PAGE MODAL ===== */
.mypage-bg{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:400;align-items:center;justify-content:center;padding:24px;
}
.mypage-bg.open{display:flex}
.mypage-modal{
  background:var(--white);border-radius:20px;padding:28px 24px;
  width:100%;max-width:340px;
  animation:fadeIn 0.2s ease;
}
.mypage-title{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:20px}
.mypage-avatar{
  width:64px;height:64px;border-radius:50%;background:var(--navy);

<script>
// ===== FIREBASE =====
firebase.initializeApp({
  apiKey: "AIzaSyDjQdD69l5E5e6xLHe0JiPTTKHL1V7sl6k",
  authDomain: "choops93-93ff.firebaseapp.com",
  projectId: "choops93-93ff",
  storageBucket: "choops93-93ff.firebasestorage.app",
  messagingSenderId: "795885457660",
  appId: "1:795885457660:web:4237eaaccba1d0ccb84779"
});
const auth = firebase.auth();
const db   = firebase.firestore();

let currentUser = null;
let appInitialized = false;

const ADJ  = ['빠른','조용한','밝은','신나는','차가운','따뜻한','용감한','영리한','날쌘','귀여운','멋진','강한','부드러운','활발한','슬기로운','씩씩한','재빠른','늠름한','다정한','지혜로운'];
const NOUN = ['고양이','강아지','호랑이','여우','토끼','사자','독수리','나비','별','달','구름','바람','파도','산','숲','꽃','나무','바다','강물','햇살'];

function randomUsername() {
  return ADJ[Math.floor(Math.random()*ADJ.length)] + NOUN[Math.floor(Math.random()*NOUN.length)];
}

// 인증 상태 감지
auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    document.getElementById('authOverlay').classList.remove('show');
    // 유저 정보 메뉴에 표시
    const snap = await db.collection('users').doc(user.uid).get();
    const username = snap.exists ? snap.data().username : '';
    document.getElementById('menuUserInfo').textContent = username ? `@${username}` : user.email;
    // 계정별 알림 시간 설정 로드
    try {
      const settingsSnap = await db.collection('users').doc(user.uid).collection('settings').doc('alarm').get();
      if (settingsSnap.exists) {
        const d = settingsSnap.data();
        if (typeof d.hour === 'number' && typeof d.minute === 'number') {
          S.settings.hour = d.hour;
          S.settings.minute = d.minute;
          localStorage.setItem('nbr_settings', JSON.stringify(S.settings));
        }
      }
    } catch(e) {}
    // 스크랩 로드
    await loadScraps();
    if (!appInitialized) { appInitialized = true; init(); }
  } else {
    currentUser = null;
    document.getElementById('authOverlay').classList.add('show');
  }
});

// 탭 전환
function switchAuthTab(tab) {
  document.getElementById('loginForm').style.display  = tab === 'login'  ? '' : 'none';
  document.getElementById('signupForm').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('tabLogin').classList.toggle('active',  tab === 'login');
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  document.getElementById('loginError').textContent  = '';
  document.getElementById('signupError').textContent = '';
}

// 로그인
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  if (!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  btn.classList.add('auth-loading'); btn.textContent = '로그인 중...';
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch(e) {
    errEl.textContent = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password'
      ? '이메일 또는 비밀번호가 틀렸습니다.' : '로그인에 실패했습니다.';
  } finally {
    btn.classList.remove('auth-loading'); btn.textContent = '로그인';
  }
}

// 회원가입
async function doSignup() {
  const email = document.getElementById('signupEmail').value.trim();
  const pw    = document.getElementById('signupPw').value;
  const pw2   = document.getElementById('signupPw2').value;
  const errEl = document.getElementById('signupError');
  const btn   = document.getElementById('signupBtn');
  if (!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  if (pw.length < 6)  { errEl.textContent = '비밀번호는 6자 이상이어야 합니다.'; return; }
  if (pw !== pw2)     { errEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }
  btn.classList.add('auth-loading'); btn.textContent = '가입 중...';
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    const username = randomUsername();
    await db.collection('users').doc(cred.user.uid).set({
      email, username, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {
    errEl.textContent = e.code === 'auth/email-already-in-use'
      ? '이미 사용 중인 이메일입니다.' : '회원가입에 실패했습니다.';
  } finally {
    btn.classList.remove('auth-loading'); btn.textContent = '회원가입';
  }
}

// 로그아웃
async function doLogout() {
  await auth.signOut();
  closeMypage();
  appInitialized = false;
}

// ===== MY PAGE =====
async function openMypage() {
  if (!currentUser) return;
  document.getElementById('mypageEmail').textContent = currentUser.email;
  const snap = await db.collection('users').doc(currentUser.uid).get();
  document.getElementById('mypageUsername').value = snap.exists ? snap.data().username : '';
  document.getElementById('mypageBg').classList.add('open');
}
function closeMypage() { document.getElementById('mypageBg').classList.remove('open'); }
function closeMypageBg(e) { if (e.target === document.getElementById('mypageBg')) closeMypage(); }
async function saveMypage() {
  const username = document.getElementById('mypageUsername').value.trim();
  if (!username) { toast('아이디를 입력해 주세요.'); return; }
  if (username.length < 2) { toast('아이디는 2자 이상이어야 합니다.'); return; }
  await db.collection('users').doc(currentUser.uid).update({ username });
  document.getElementById('menuUserInfo').textContent = `@${username}`;
  closeMypage();
  toast('저장됐습니다.');
}

// Enter 키 지원
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('loginForm').style.display !== 'none' &&
      document.getElementById('authOverlay').classList.contains('show')) doLogin();
  else if (document.getElementById('signupForm').style.display !== 'none' &&
      document.getElementById('authOverlay').classList.contains('show')) doSignup();
});

// ===== STATE =====
const S = {
  today: new Date(),
  year: new Date().getFullYear(),
  month: new Date().getMonth(),
  selected: null,
  newsData: {},
  settings: { hour: 8, minute: 0 },
  notifState: {},
  currentNewsDate: null,
  currentTab: 'trend',
  notifPanelOpen: false,
  checkTimer: null,
  scraps: new Set()
};

const CAT_META = {
  trend:  { label: '트렌드',   color: '#ff6b6b', icon: '🔥' },
  social: { label: '사회/경제', color: '#4ecdc4', icon: '💰' },
  it:     { label: 'IT',        color: '#45b7d1', icon: '💻' },
  global: { label: '해외뉴스',  color: '#96ceb4', icon: '🌍' }
};

function fmt(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDisplay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}

function fmtShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const todayStr = fmt(S.today);
  const diff = Math.round((new Date(todayStr) - new Date(dateStr)) / 86400000);
  if (diff === 0) return '오늘 ' + dateStr.slice(5).replace('-','.');
  if (diff === 1) return '어제 ' + dateStr.slice(5).replace('-','.');
  return `${diff}일 전 ` + dateStr.slice(5).replace('-','.');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== INIT =====
async function init() {
  loadSettings();
  initSelects();
  await loadNewsData();
  renderCalendar();
  checkNotification();
  S.checkTimer = setInterval(checkNotification, 30000);
  setupSwipe();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('nbr_settings') || 'null');
    if (s) S.settings = s;
    const n = JSON.parse(localStorage.getItem('nbr_notif') || 'null');
    if (n) S.notifState = n;
  } catch(e) {}
}

function saveNotifState() {
  localStorage.setItem('nbr_notif', JSON.stringify(S.notifState));
}

function initSelects() {
  const hs = document.getElementById('hourSelect');
  const ms = document.getElementById('minuteSelect');
  for (let h = 5; h <= 12; h++) {
    const o = document.createElement('option');
    o.value = h; o.textContent = h + '시';
    if (h === S.settings.hour) o.selected = true;
    hs.appendChild(o);
  }
  [0,10,20,30,40,50].forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = String(m).padStart(2,'0') + '분';
    if (m === S.settings.minute) o.selected = true;
    ms.appendChild(o);
  });
}

// ===== NEWS DATA =====
async function loadNewsData() {
  setLoading(true);
  try {
    const res = await fetch('./news_data.json?v=' + Date.now());
    if (res.ok) S.newsData = await res.json();
    const cached = localStorage.getItem('nbr_news_cache');
    if (cached) {
      try {
        const cachedData = JSON.parse(cached);
        Object.keys(cachedData).forEach(date => {
          if (!S.newsData[date]) S.newsData[date] = cachedData[date];
        });
      } catch(e) {}
    }
  } catch(e) {}
  setLoading(false);
  tryFetchRSS();
}

function setLoading(on) {
  document.getElementById('loadingRing').classList.toggle('show', on);
}

async function tryFetchRSS() {
  const PROXY = 'https://api.allorigins.win/raw?url=';
  const FEEDS = {
    trend:  'https://news.google.com/rss/search?q=한국+트렌드+이슈&hl=ko&gl=KR&ceid=KR:ko',
    social: 'https://news.google.com/rss/search?q=한국+경제+사회&hl=ko&gl=KR&ceid=KR:ko',
    it:     'https://news.google.com/rss/search?q=한국+IT+기술+인공지능&hl=ko&gl=KR&ceid=KR:ko',
    global: 'https://news.google.com/rss/search?q=국제뉴스+세계&hl=ko&gl=KR&ceid=KR:ko'
  };
  const todayStr = fmt(S.today);
  const cacheDate = localStorage.getItem('nbr_news_cache_date');
  if (cacheDate === todayStr) return;

  setLoading(true);
  try {
    const result = {};
    await Promise.all(Object.entries(FEEDS).map(async ([cat, feedUrl]) => {
      try {
        const res = await fetch(PROXY + encodeURIComponent(feedUrl));
        if (!res.ok) return;
        const txt = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(txt, 'text/xml');
        const items = Array.from(xml.querySelectorAll('item'));
        const parsed = [];
        for (const item of items) {
          if (parsed.length >= 3) break;
          let title = item.querySelector('title')?.textContent?.trim() || '';
          let source = 'Google 뉴스';
          if (title.includes(' - ')) {
            const parts = title.split(' - ');
            source = parts.pop().trim();
            title = parts.join(' - ').trim();
          }
          const summary = (item.querySelector('description')?.textContent || '')
            .replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim().slice(0, 200);
          // Google News RSS에서 링크 추출: <link> 태그 또는 nextSibling 방식
          let articleUrl = '';
          const linkEls = item.getElementsByTagName('link');
          for (const el of linkEls) {
            const txt = (el.textContent || el.getAttribute('href') || '').trim();
            if (txt.startsWith('http')) { articleUrl = txt; break; }
          }
          if (!articleUrl) articleUrl = item.querySelector('guid')?.textContent?.trim() || '';
          if (!title) continue;
          parsed.push({ title, summary, source, url: articleUrl });
        }
        result[cat] = parsed;
      } catch(e) {}
    }));

    const cats = ['trend','social','it','global'];
    if (cats.some(c => result[c] && result[c].length > 0)) {
      S.newsData[todayStr] = {
        trend:  result.trend  || S.newsData[todayStr]?.trend  || [],
        social: result.social || S.newsData[todayStr]?.social || [],
        it:     result.it     || S.newsData[todayStr]?.it     || [],
        global: result.global || S.newsData[todayStr]?.global || []
      };
      localStorage.setItem('nbr_news_cache', JSON.stringify(S.newsData));
      localStorage.setItem('nbr_news_cache_date', todayStr);
      renderCalendar();
    }
  } catch(e) {}
  setLoading(false);
}

async function refreshTodayNews() {
  localStorage.removeItem('nbr_news_cache_date');
  toast('뉴스를 업데이트하는 중...');
  await tryFetchRSS();
  renderCalendar();
  toast('뉴스가 업데이트됐습니다.');
}

// ===== CALENDAR =====
function renderCalendar() {
  const grid = document.getElementById('daysGrid');
  const title = document.getElementById('calTitle');
  title.textContent = `${S.year}년 ${S.month + 1}월`;
  grid.innerHTML = '';

  const todayStr = fmt(S.today);
  const selStr = S.selected ? fmt(S.selected) : todayStr;
  const firstDay = new Date(S.year, S.month, 1).getDay();
  const daysInMonth = new Date(S.year, S.month + 1, 0).getDate();
  const prevDays = new Date(S.year, S.month, 0).getDate();

  for (let i = firstDay - 1; i >= 0; i--) {
    grid.appendChild(makeDay(prevDays - i, S.year, S.month - 1, true, todayStr, selStr));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    grid.appendChild(makeDay(d, S.year, S.month, false, todayStr, selStr));
  }
  const total = grid.children.length;
  const fill = total <= 35 ? 35 - total : 42 - total;
  for (let d = 1; d <= fill; d++) {
    grid.appendChild(makeDay(d, S.year, S.month + 1, true, todayStr, selStr));
  }
}

function makeDay(d, y, m, other, todayStr, selStr) {
  const cell = document.createElement('div');
  cell.className = 'day';
  const real = new Date(y, m, d);
  const ds = fmt(real);
  const dow = real.getDay();

  if (other) { cell.classList.add('other', 'empty'); }
  else {
    if (ds === todayStr) cell.classList.add('today');
    if (ds === selStr)   cell.classList.add('selected');
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
  }

  const num = document.createElement('div');
  num.className = 'day-num';
  num.textContent = d;
  cell.appendChild(num);

  if (!other && S.newsData[ds]) {
    const dot = document.createElement('div');
    dot.className = 'news-dot';
    cell.appendChild(dot);
  }

  if (!other) {
    cell.onclick = () => {
      S.selected = real;
      renderCalendar();
      openNews(ds);
    };
  }
  return cell;
}

function changeMonth(dir) {
  S.month += dir;
  if (S.month > 11) { S.month = 0; S.year++; }
  if (S.month < 0)  { S.month = 11; S.year--; }
  renderCalendar();
}

// ===== NOTIFICATION LOGIC =====
function checkNotification() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const todayStr = fmt(S.today);

  const state = S.notifState[todayStr] || { delivered: false, read: false };

  if (!state.delivered && (h > S.settings.hour || (h === S.settings.hour && m >= S.settings.minute))) {
    state.delivered = true;
    state.read = false;
    S.notifState[todayStr] = state;

    // prune old beyond 7 days
    const cutoff = new Date(S.today);
    cutoff.setDate(cutoff.getDate() - 7);
    Object.keys(S.notifState).forEach(k => {
      if (new Date(k) < cutoff) delete S.notifState[k];
    });

    saveNotifState();
    updateDot();

    // 설정 시간 도달 시 뉴스 자동 갱신
    loadNewsData().then(() => {
      renderCal();
      const news = S.newsData[todayStr];
      const firstTitle = news?.trend?.[0]?.title || news?.social?.[0]?.title || '오늘의 뉴스를 확인하세요.';
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        try { new Notification('📰 뉴스 브리핑', { body: firstTitle, tag: 'nbr-' + todayStr }); } catch(e) {}
      }
    });
  }

  updateDot();
}

function updateDot() {
  const todayStr = fmt(S.today);
  const state = S.notifState[todayStr];
  const show = state && state.delivered && !state.read;
  document.getElementById('notifDot').classList.toggle('show', !!show);
}

// ===== NOTIFICATION PANEL =====
function toggleNotifPanel() {
  if (S.notifPanelOpen) {
    closeNotifPanel();
  } else {
    openNotifPanel();
  }
}

function openNotifPanel() {
  requestNotifPermission();
  renderNotifList();
  document.getElementById('notifPanel').classList.add('open');
  S.notifPanelOpen = true;
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('open');
  S.notifPanelOpen = false;
}

function renderNotifList() {
  const list = document.getElementById('notifList');
  list.innerHTML = '';

  const dates = getLast7Days();
  const delivered = dates.filter(d => S.notifState[d] && S.notifState[d].delivered);

  if (delivered.length === 0) {
    list.innerHTML = '<div class="notif-empty">아직 알림이 없습니다.<br>매일 설정 시간에 뉴스 알림이 도착해요.</div>';
    return;
  }

  delivered.forEach(dateStr => {
    const state = S.notifState[dateStr];
    const news = S.newsData[dateStr];
    const firstTitle = news?.trend?.[0]?.title || news?.social?.[0]?.title || news?.it?.[0]?.title || '뉴스 없음';

    const item = document.createElement('div');
    item.className = 'notif-item';
    item.innerHTML = `
      <div class="notif-item-top">
        <span class="notif-date">${fmtShort(dateStr)}</span>
        <span class="${state.read ? 'notif-read-badge' : 'notif-unread-badge'}">${state.read ? '읽음' : '새 뉴스'}</span>
      </div>
      <div class="notif-preview">${firstTitle}<span class="notif-preview-suffix"> …</span></div>
    `;
    item.onclick = () => {
      closeNotifPanel();
      markRead(dateStr);
      openNews(dateStr);
    };
    list.appendChild(item);
  });
}

function getLast7Days() {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(S.today);
    d.setDate(d.getDate() - i);
    days.push(fmt(d));
  }
  return days;
}

function markRead(dateStr) {
  if (S.notifState[dateStr]) {
    S.notifState[dateStr].read = true;
    saveNotifState();
  }
  // check if today's is now read → hide dot
  const todayStr = fmt(S.today);
  if (dateStr === todayStr) updateDot();
}

async function requestNotifPermission() {
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

// ===== NEWS POPUP =====
function openNews(dateStr) {
  S.currentNewsDate = dateStr;
  document.getElementById('newsDateTitle').textContent = fmtDisplay(dateStr);
  renderNewsContent();
  document.getElementById('newsBg').classList.add('open');
}

function closeNews() {
  document.getElementById('newsBg').classList.remove('open');
  if (S.currentNewsDate) {
    markRead(S.currentNewsDate);
    S.currentNewsDate = null;
  }
}

function closeNewsOnBg(e) {
  if (e.target === document.getElementById('newsBg')) closeNews();
}

function renderNewsContent() {
  const content = document.getElementById('newsContent');
  const data = S.newsData[S.currentNewsDate];

  if (!data) {
    content.innerHTML = '<div class="no-news">이 날짜의 뉴스 데이터가 없습니다.</div>';
    return;
  }

  const cats = ['trend','social','it','global'];
  let html = '';

  cats.forEach(cat => {
    const articles = data[cat] || [];
    if (!articles.length) return;
    const m = CAT_META[cat];
    html += `<div class="news-section">
      <div class="news-section-hd" style="background:${m.color}">
        <span class="news-section-icon">${m.icon}</span>
        <span class="news-section-label">${m.label}</span>
      </div>`;
    articles.forEach((a, i) => {
      const id = `${cat}_${i}`;
      const scrapData = {date: S.currentNewsDate, category: cat, title: a.title, summary: a.summary, source: a.source, url: a.url||''};
      const isScraped = S.scraps.has(scrapKey(S.currentNewsDate, a.title));
      html += `
      <div class="acc-item">
        <div class="acc-title" onclick="toggleAcc('${id}')">
          <span class="acc-title-text">${a.title}</span>
          <span class="scrap-btn${isScraped ? ' scraped' : ''}" id="scrap_${id}" onclick="toggleScrap(event,'${id}','${encodeURIComponent(JSON.stringify(scrapData))}')" >🔖</span>
          <span class="acc-arrow" id="arrow_${id}">›</span>
        </div>
        <div class="acc-body" id="body_${id}">
          <p class="acc-summary">${formatSummary(a.summary)}</p>
          <div class="acc-source" onclick="openArticle('${encodeURIComponent(a.url||'')}','${encodeURIComponent(a.title||'')}')">🔗 ${a.source}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  content.innerHTML = html || '<div class="no-news">뉴스 데이터가 없습니다.</div>';
  content.scrollTop = 0;
}

function openArticle(encodedUrl, encodedTitle) {
  const url = decodeURIComponent(encodedUrl);
  const title = decodeURIComponent(encodedTitle);
  const target = url || `https://news.google.com/search?q=${encodeURIComponent(title)}&hl=ko`;
  window.open(target, '_blank', 'noopener');
}

function formatSummary(text) {
  // Bold numbers and key phrases for readability
  return text
    .replace(/(\d+\.?\d*[%억만조원명개])/g, '<b>$1</b>')
    .replace(/(전년 대비|전월 대비|역대 최고|역대 최저|처음으로|공식 발표|잠정 합의)/g, '<b>$1</b>');
}

function toggleAcc(id) {
  const body = document.getElementById(`body_${id}`);
  const arrow = document.getElementById(`arrow_${id}`);
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.acc-body.open').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.acc-arrow.open').forEach(a => a.classList.remove('open'));
  if (!isOpen) {
    body.classList.add('open');
    arrow.classList.add('open');
  }
}

// ===== SCRAP =====
function scrapKey(date, title) { return date + '::' + title; }

async function loadScraps() {
  if (!currentUser) return;
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('scraps').get();
    S.scraps.clear();
    snap.forEach(doc => {
      const d = doc.data();
      if (d.date && d.title) S.scraps.add(scrapKey(d.date, d.title));
    });
  } catch(e) {}
}

async function toggleScrap(event, id, encodedData) {
  event.stopPropagation();
  if (!currentUser) { toast('로그인이 필요합니다.'); return; }
  let article;
  try { article = JSON.parse(decodeURIComponent(encodedData)); } catch(e) { return; }
  const key = scrapKey(article.date, article.title);
  const btn = document.getElementById('scrap_' + id);
  const scrapsRef = db.collection('users').doc(currentUser.uid).collection('scraps');
  const docId = btoa(encodeURIComponent(article.date + article.title)).substring(0, 20);
  if (S.scraps.has(key)) {
    // 스크랩 해제
    try { await scrapsRef.doc(docId).delete(); } catch(e) {}
    S.scraps.delete(key);
    if (btn) btn.classList.remove('scraped');
    toast('스크랩이 해제됐습니다.');
  } else {
    // 스크랩 추가
    try {
      await scrapsRef.doc(docId).set({
        date: article.date,
        category: article.category,
        title: article.title,
        summary: article.summary,
        source: article.source,
        url: article.url,
        scrappedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch(e) {}
    S.scraps.add(key);
    if (btn) btn.classList.add('scraped');
    toast('스크랩됐습니다.');
  }
}

function openScrapPanel() {
  document.getElementById('scrapPanel').classList.add('open');
  renderScrapList();
}
function closeScrapPanel() {
  document.getElementById('scrapPanel').classList.remove('open');
}

async function renderScrapList() {
  const listEl = document.getElementById('scrapList');
  const countEl = document.getElementById('scrapCount');
  if (!currentUser) { listEl.innerHTML = '<div class="scrap-empty">로그인이 필요합니다.</div>'; return; }
  listEl.innerHTML = '<div class="scrap-empty">불러오는 중...</div>';
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('scraps').orderBy('scrappedAt','desc').get();
    if (snap.empty) {
      if (countEl) countEl.textContent = '';
      listEl.innerHTML = '<div class="scrap-empty">📌 스크랩한 기사가 없습니다.<br>기사 옆 🔖를 눌러 저장하세요.</div>';
      return;
    }
    if (countEl) countEl.textContent = `총 ${snap.size}개`;
    const groups = {};
    snap.forEach(doc => {
      const d = { ...doc.data(), _id: doc.id };
      if (!groups[d.date]) groups[d.date] = [];
      groups[d.date].push(d);
    });
    const catColors = { trend:'#ff6b6b', social:'#4ecdc4', it:'#45b7d1', global:'#96ceb4' };
    const catLabels = { trend:'트렌드', social:'사회/경제', it:'IT', global:'해외' };
    let html = '';
    Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(date => {
      html += `<div class="scrap-date-group"><div class="scrap-date-label">${fmtDisplay(date)}</div>`;
      groups[date].forEach(a => {
        const color  = catColors[a.category]  || '#bbb';
        const label  = catLabels[a.category] || a.category;
        const encDate  = encodeURIComponent(date);
        const encTitle = encodeURIComponent(a.title || '');
        const encUrl   = encodeURIComponent(a.url   || '');
        const docId    = a._id;
        html += `<div class="scrap-article" id="sa_${docId}">
          <div>
            <span class="scrap-cat-badge" style="background:${color}">${label}</span>
          </div>
          <div class="scrap-article-body">
            <div class="scrap-article-title" onclick="openNewsFromScrap('${encDate}')">${a.title}</div>
            <div class="scrap-article-summary">${a.summary || ''}</div>
            <div class="scrap-article-meta">
              <span>${a.source || ''}</span>
              ${a.url ? `<span class="scrap-article-link" onclick="openArticle('${encUrl}','${encTitle}')">기사 보기 →</span>` : ''}
            </div>
          </div>
          <button class="scrap-remove-btn" onclick="removeScrapFromList('${docId}','${encodeURIComponent(a.date)}','${encTitle}',this)" title="스크랩 해제">✕</button>
        </div>`;
      });
      html += '</div>';
    });
    listEl.innerHTML = html;
  } catch(e) {
    listEl.innerHTML = '<div class="scrap-empty">불러오기 실패. 다시 시도해 주세요.</div>';
  }
}

async function removeScrapFromList(docId, encDate, encTitle, btn) {
  if (!currentUser) return;
  const date = decodeURIComponent(encDate);
  const title = decodeURIComponent(encTitle);
  try { await db.collection('users').doc(currentUser.uid).collection('scraps').doc(docId).delete(); } catch(e) {}
  S.scraps.delete(scrapKey(date, title));
  // 버튼의 부모 article 요소 제거
  const article = btn.closest('.scrap-article');
  if (article) {
    const group = article.closest('.scrap-date-group');
    article.remove();
    if (group && group.querySelectorAll('.scrap-article').length === 0) group.remove();
  }
  // 스크랩 패널이 비어있으면 안내 문구 표시
  const listEl = document.getElementById('scrapList');
  if (listEl && !listEl.querySelector('.scrap-article')) {
    listEl.innerHTML = '<div class="scrap-empty">📌 스크랩한 기사가 없습니다.<br>기사 옆 🔖를 눌러 저장하세요.</div>';
  }
  toast('스크랩이 해제됐습니다.');
}

function openNewsFromScrap(encDate) {
  const date = decodeURIComponent(encDate);
  closeScrapPanel();
  openNews(date);
}

function openMenu() {
  document.getElementById('menuDrawer').classList.add('open');
  document.getElementById('menuBg').classList.add('open');
}
function closeMenu() {
  document.getElementById('menuDrawer').classList.remove('open');
  document.getElementById('menuBg').classList.remove('open');
}

// ===== TIME MODAL =====
function openTimeModal() {
  const hs = document.getElementById('hourSelect');
  const ms = document.getElementById('minuteSelect');
  hs.value = S.settings.hour;
  ms.value = S.settings.minute;
  document.getElementById('timeModalBg').classList.add('open');
}
function closeTimeModal() {
  document.getElementById('timeModalBg').classList.remove('open');
}
function closeTimeModalBg(e) {
  if (e.target === document.getElementById('timeModalBg')) closeTimeModal();
}
function saveTime() {
  S.settings.hour   = parseInt(document.getElementById('hourSelect').value);
  S.settings.minute = parseInt(document.getElementById('minuteSelect').value);
  localStorage.setItem('nbr_settings', JSON.stringify(S.settings));

  // Firestore에 계정별 알림 시간 저장
  if (currentUser) {
    db.collection('users').doc(currentUser.uid).collection('settings').doc('alarm').set({
      hour: S.settings.hour,
      minute: S.settings.minute,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => {});
  }

  const todayStr = fmt(S.today);
  if (S.notifState[todayStr]) S.notifState[todayStr].delivered = false;
  saveNotifState();

  const hh = S.settings.hour;
  const mm = String(S.settings.minute).padStart(2,'0');
  closeTimeModal();
  showSuccessPopup(`오전 ${hh}시 ${mm}분`);
  try { checkNotification(); } catch(e) {}
}

// ===== SUCCESS POPUP =====
function showSuccessPopup(timeStr) {
  const popup = document.getElementById('successPopup');
  document.getElementById('successTime').textContent = timeStr;
  popup.classList.add('show');
  clearTimeout(popup._t);
  popup._t = setTimeout(() => {
    popup.style.opacity = '0';
    popup.style.transition = 'opacity 0.3s';
    setTimeout(() => {
      popup.classList.remove('show');
      popup.style.opacity = '';
      popup.style.transition = '';
    }, 300);
  }, 1800);
}

// ===== SWIPE TO CLOSE =====
function setupSwipe() {
  const sheet = document.getElementById('newsSheet');
  const content = document.getElementById('newsContent');
  let startY = 0;
  sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 80 && content.scrollTop === 0) closeNews();
  }, { passive: true });
}

// ===== CLOSE NOTIF PANEL ON OUTSIDE CLICK =====
document.addEventListener('click', e => {
  if (!S.notifPanelOpen) return;
  const panel = document.getElementById('notifPanel');
  const bell  = document.getElementById('bellBtn');
  if (!panel.contains(e.target) && !bell.contains(e.target)) {
    closeNotifPanel();
  }
}, true);
